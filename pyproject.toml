[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memocore"
version = "0.1.0"
description = "Long-term memory engine for LLM agents, with a reproducible LoCoMo evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "nltk>=3.8",
    "tqdm>=4.66",
    "mcp>=1.10",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.2"]

[project.scripts]
memocore = "memocore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
