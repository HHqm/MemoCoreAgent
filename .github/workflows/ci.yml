name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      # Offline: mock chat model, hashing embedder and a tiny LoCoMo-format fixture. No API key needed.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
